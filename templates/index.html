<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 환경에서 줌인/줌아웃(Pinch-to-zoom) 및 자유로운 확대가 가능하도록 뷰포트 강제 허용 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>새싹발굴하기 - Pro Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        @viewport {
            width: device-width;
            zoom: 1.0;
            min-zoom: 0.5;
            max-zoom: 5.0;
            user-zoom: fixed;
        }
        .main { background-color: #f8f9fa; }
        body { font-family: 'Helvetica Neue', sans-serif; margin: 0; padding: 15px; background-color: #f8f9fa; color: #333; }
        
        /* 탭 전체 영역 간격 */
        .stTabs-list { display: flex; gap: 8px; border-bottom: 2px solid #e9ecef; margin-bottom: 20px; overflow-x: auto; }
        .stTab-btn {
            height: 48px; padding: 0 16px; white-space: pre-wrap; background-color: #ffffff;
            border-radius: 8px 8px 0px 0px; font-weight: 600; font-size: 15px; color: #495057;
            border: 1px solid #dee2e6; border-bottom: none; cursor: pointer; flex-shrink: 0;
        }
        .stTab-btn.active {
            background-color: #ffffff !important; color: #0047AB !important;
            border-top: 3px solid #0047AB !important; border-bottom: 2px solid #ffffff !important;
            font-weight: 700;
        }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 0 0 8px 8px; border: 1px solid #dee2e6; border-top: none; }
        .tab-content.active { display: block; }

        div.stExpander { border-radius: 8px; border: 1px solid #e0e0e0; background-color: white; margin-bottom: 10px; padding: 10px; }
        
        .hot-badge {
            background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404;
            padding: 10px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 15px;
        }
        h1, h2, h3 { font-family: 'Helvetica Neue', sans-serif; letter-spacing: -0.5px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        select, input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #dee2e6; font-size: 15px; box-sizing: border-box; }
        
        /* 사이드바 스타일 모사 */
        .sidebar { background: #f1f3f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- 🛠️ 대시보드 제어판 (사이드바 설정 내용 반영) -->
    <div class="sidebar">
        <h2>🛠️ 대시보드 제어판</h2>
        <hr>
        <div style="font-weight: bold; margin-bottom: 10px;">📌 [외국인] 상세 수급 설정</div>
        <label><input type="checkbox" id="chk_bar_외국인" checked onchange="triggerUpdate()"> 당일 순매수 바(Bar)</label> &nbsp;&nbsp;
        <label><input type="checkbox" id="chk_cum_외국인" checked onchange="triggerUpdate()"> 누적 수급선</label> &nbsp;&nbsp;
        <label><input type="checkbox" id="chk_ma5_외국인" checked onchange="triggerUpdate()"> 5일 이동평균선</label>
    </div>

    <!-- 탭 5개 구성 -->
    <div class="stTabs-list">
        <button class="stTab-btn active" onclick="switchTab(0)">🔎 개별 종목 분석</button>
        <button class="stTab-btn" onclick="switchTab(1)">🌱 새싹 발굴</button>
        <button class="stTab-btn" onclick="switchTab(2)">🚀 희망 종목</button>
        <button class="stTab-btn" onclick="switchTab(3)">🚨 정리 종목</button>
        <button class="stTab-btn" onclick="switchTab(4)">⭐ 나의 새싹 즐겨찾기</button>
    </div>

    <!-- 탭 1: 개별 종목 분석 -->
    <div id="tab-0" class="tab-content active">
        <div class="grid-2">
            <div>
                <label>📊 분석할 종목을 입력하거나 고르세요:</label>
                <select id="sel_tab1" onchange="loadChart(1)"></select>
            </div>
            <div>
                <label>📅 분석 기간을 선택하세요:</label>
                <input type="date" id="start_tab1" value="2026-01-01" onchange="loadChart(1)">
            </div>
        </div>
        <div id="chart_tab1" style="width:100%; height:500px;"></div>
    </div>

    <!-- 탭 2: 새싹 발굴 -->
    <div id="tab-1" class="tab-content">
        <div class="hot-badge">💡 생애 최초로 외국인 수급이 유입된 기업들입니다. (🌱 표시는 최근 5일 내 신규 진입 종목)</div>
        <div class="grid-2">
            <div>
                <label>발굴된 새싹 종목 선택:</label>
                <select id="sel_tab2" onchange="loadChart(2)"></select>
            </div>
            <div>
                <label>📅 분석 기간을 선택하세요:</label>
                <input type="date" id="start_tab2" value="2026-01-01" onchange="loadChart(2)">
            </div>
        </div>
        <div id="chart_tab2" style="width:100%; height:500px;"></div>
    </div>

    <!-- 탭 3: 희망 종목 -->
    <div id="tab-2" class="tab-content">
        <div class="hot-badge">💡 전 5일 대비 수급 증가율이 20% 이상인 종목들입니다. (🔥 표시는 최근 5일 내 신규 진입)</div>
        <div class="grid-2">
            <div>
                <label>희망 종목 선택:</label>
                <select id="sel_tab3" onchange="loadChart(3)"></select>
            </div>
            <div>
                <label>📅 분석 기간을 선택하세요:</label>
                <input type="date" id="start_tab3" value="2026-01-01" onchange="loadChart(3)">
            </div>
        </div>
        <div id="chart_tab3" style="width:100%; height:500px;"></div>
    </div>

    <!-- 탭 4: 정리 종목 -->
    <div id="tab-3" class="tab-content">
        <div class="hot-badge">💡 전 5일 대비 수급 하락률이 10%를 초과하는 종목들입니다. 30% 이상은 리스트에서 제거. (🚨 표시는 최근 5일 내 급하락 진입)</div>
        <div class="grid-2">
            <div>
                <label>정리 종목 선택:</label>
                <select id="sel_tab4" onchange="loadChart(4)"></select>
            </div>
            <div>
                <label>📅 분석 기간을 선택하세요:</label>
                <input type="date" id="start_tab4" value="2026-01-01" onchange="loadChart(4)">
            </div>
        </div>
        <div id="chart_tab4" style="width:100%; height:500px;"></div>
    </div>

    <!-- 탭 5: 나의 새싹 즐겨찾기 -->
    <div id="tab-4" class="tab-content">
        <div class="grid-2">
            <div>
                <label>📌 즐겨찾기 종목 선택 (다중 선택 가능):</label>
                <select id="sel_tab5" multiple style="height: 120px;" onchange="loadChart(5)"></select>
            </div>
            <div>
                <label>📅 분석 기간을 선택하세요:</label>
                <input type="date" id="start_tab5" value="2026-01-01" onchange="loadChart(5)">
            </div>
        </div>
        <div id="chart_tab5" style="width:100%; height:500px;"></div>
    </div>

    <script>
        let currentActiveTab = 1;

        function switchTab(index) {
            currentActiveTab = index + 1;
            const btns = document.querySelectorAll('.stTab-btn');
            const contents = document.querySelectorAll('.tab-content');
            btns.forEach((b, i) => {
                b.classList.toggle('active', i === index);
                contents[i].classList.toggle('active', i === index);
            });
            loadChart(currentActiveTab);
        }

        async function init() {
            const res = await fetch('/api/init_data');
            const data = await res.json();

            populateSelect('sel_tab1', data.stocks);
            populateSelect('sel_tab2', data.sprouts.length ? data.sprouts : ["종목 없음"]);
            populateSelect('sel_tab3', data.hopes.length ? data.hopes : ["종목 없음"]);
            populateSelect('sel_tab4', data.cleans.length ? data.cleans : ["종목 없음"]);
            
            const sel5 = document.getElementById('sel_tab5');
            sel5.innerHTML = '';
            data.stocks.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.text = item;
                if (data.default_favs.includes(item)) opt.selected = true;
                sel5.appendChild(opt);
            });

            loadChart(1);
        }

        function populateSelect(elementId, items) {
            const sel = document.getElementById(elementId);
            sel.innerHTML = '';
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.text = item;
                sel.appendChild(opt);
            });
        }

        function parseTicker(val) {
            if (!val || val === "종목 없음") return { ticker: "", name: "" };
            const parts = val.split('(');
            const name = parts[0].replace("🌱 ", "").replace("🔥 ", "").replace("🚨 ", "").trim();
            const ticker = parts[1].replace(')', '').trim();
            return { ticker, name };
        }

        function triggerUpdate() {
            loadChart(currentActiveTab);
        }

        async function loadChart(tabNum) {
            let selId = `sel_tab${tabNum}`;
            let startId = `start_tab${tabNum}`;
            let chartId = `chart_tab${tabNum}`;
            
            const selElem = document.getElementById(selId);
            const startDate = document.getElementById(startId).value;
            const endDate = new Date().toISOString().split('T')[0];

            const showBar = document.getElementById('chk_bar_외국인').checked;
            const showCum = document.getElementById('chk_cum_외국인').checked;
            const showMa5 = document.getElementById('chk_ma5_외국인').checked;

            const configs = {
                "외국인": { active: true, bar: showBar, cum: showCum, ma5: showMa5, ma10: false, ma20: false, color: "#FF0000", pos_bar: "#FF0000", neg_bar: "#FFA07A" },
                "기관": { active: false, bar: false, cum: false, ma5: false, ma10: false, ma20: false, color: "#1F77B4", pos_bar: "#1E90FF", neg_bar: "#B0C4DE" },
                "개인": { active: false, bar: false, cum: false, ma5: false, ma10: false, ma20: false, color: "#2CA02C", pos_bar: "#32CD32", neg_bar: "#8FBC8F" }
            };

            if (tabNum === 5) {
                const selectedOptions = Array.from(selElem.selectedOptions).map(opt => opt.value);
                const container = document.getElementById(chartId);
                container.innerHTML = '';
                if (selectedOptions.length === 0) return;

                for (let i = 0; i < selectedOptions.length; i++) {
                    const { ticker, name } = parseTicker(selectedOptions[i]);
                    const subDiv = document.createElement('div');
                    subDiv.id = `sub_chart_${i}`;
                    subDiv.style.height = '450px';
                    subDiv.style.marginBottom = '20px';
                    container.appendChild(subDiv);

                    fetchChartData(ticker, name, startDate, endDate, configs, subDiv.id);
                }
                return;
            }

            const { ticker, name } = parseTicker(selElem.value);
            if (!ticker) return;

            fetchChartData(ticker, name, startDate, endDate, configs, chartId);
        }

        async function fetchChartData(ticker, name, start, end, configs, targetElementId) {
            const res = await fetch('/api/get_chart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticker, name, start, end, configs })
            });
            const data = await res.json();
            if (!data.empty) {
                Plotly.react(targetElementId, data.chart.data, data.chart.layout, { scrollZoom: true, displayModeBar: false, responsive: true });
            } else {
                document.getElementById(targetElementId).innerHTML = '<p style="text-align:center; padding:50px;">해당 기간 내 데이터가 없습니다.</p>';
            }
        }

        init();
    </script>
</body>
</html>
